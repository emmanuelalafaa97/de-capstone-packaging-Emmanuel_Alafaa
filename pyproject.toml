[project]
name = "omnicart-pipeline-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Emmanuel Alafaa",email = "manuel.alafaa@gmail.com"}
]
license = {text = "n"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "logging (>=0.4.9.6,<0.5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "twine (>=6.2.0,<7.0.0)"
]



[tool.poetry]
packages = [{include = "omnicart_pipeline"}]

include = [
    "omnicart_pipeline/pipeline.cfg"
]

[tool.poetry.scripts]
omnicart-pipeline = "omnicart_pipeline.cli:main"